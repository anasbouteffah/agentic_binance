# Write to Earn automation settings.
# Every value here can be changed without touching code.

# auto    -> generate, check, and publish without human input
# review  -> generate and check, then wait in data/queue/ for `w2e approve <id>`
# dry-run -> generate and check, print the result, publish nothing
mode: auto

# Language of the posts (any language Claude writes well: en, fr, ar, es, ...)
language: en

llm:
  # Free setup (Oct 12, owner: no paid API keys): Google's free Gemini tier through
  # its OpenAI-compatible endpoint. Free key from https://aistudio.google.com/apikey
  # saved in the GEMINI_API_KEY environment variable. Check the model name in AI Studio.
  # Paid Claude instead: provider: anthropic, model: claude-sonnet-5-5 (needs ANTHROPIC_API_KEY).
  # Local and keyless: base_url: http://localhost:11434/v1, model: <an Ollama model>, api_key_env: ""
  provider: openai_compatible
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-flash-latest
  api_key_env: GEMINI_API_KEY
  # low | medium | high (Claude only)
  effort: medium

schedule:
  # Binance's OpenAPI allows 100 posts/day, but volume is what gets accounts
  # flagged. A few strong posts per day beat many weak ones.
  # 8/day, one every ~3 hours (owner choice, Oct 6: back to the Oct 1-2 setup
  # that earned the first payout; 12/day lowered views per post). Binance demonetizes high-volume repetitive accounts,
  # and a single violation record blocks the Verified badge.
  max_posts_per_day: 8
  min_minutes_between_posts: 150
  # Only publish between these UTC hours (start inclusive, end exclusive).
  active_hours_utc: [0, 24]
  # Chance that a scheduler tick which passes every gate actually posts.
  # Below 1.0 spreads posting times so they do not look machine-regular.
  post_probability: 0.6

content:
  # Relative weights. The planner never picks the same format twice in a row.
  formats:
    # Sept 30 stats: posts on altcoins with big moves got 150-470 views,
    # BTC-centred posts 12-35. Weight toward coin_focus on top movers.
    # Oct 4 stats: big movers and follow-ups 200-680 views; explainers and
    # +3% coins 49-78. Explainers off; quiet slots are skipped (min_move_pct).
    market_pulse: 3     # top movers of the day, with numbers
    coin_focus: 6       # one coin: price action, volume, funding, levels
    news_take: 1        # an opinion on a fresh headline, backed by market data
    explainer: 1        # a concept explained with today's data as the example
  # One long-form article per week (Square "article" type, with chart cover).
  weekly_article:
    enabled: true
    weekday: 6          # 0 = Monday ... 6 = Sunday
  # Coins the bot prefers for coin_focus. Top movers are added automatically.
  watchlist: [BTC, ETH, BNB, SOL, XRP, DOGE, ADA, TON, AVAX, LINK, SUI, TRX]
  # Ignore illiquid pairs (24h quote volume in USDT).
  min_quote_volume_usdt: 20000000
  # Do not write about the same coin again within this many hours.
  # Applies to every format (news and explainers use the post's main coin).
  coin_cooldown_hours: 12
  # Skip the run (post nothing) when no fresh coin moved at least this % in 24h.
  # Fewer, stronger posts beat filler: filler drags views and looks like spam.
  # Oct 5 stats: moves of 15%+ got 128-269 views, 12% moves 35-76, BTC 36.
  # Oct 6: owner asked to return to the Oct 1-2 setup (post every slot,
  # biggest mover first), so the skip is off again.
  min_move_pct: 0
  # Follow up on an earlier post (even inside the cooldown) once its coin has
  # moved this % since that post and at least this many hours have passed.
  follow_up_move_pct: 5
  follow_up_min_hours: 4
  # Attach a generated price chart to posts that focus on one coin.
  charts: true
  # Chart watermark text. Empty: Square already stamps the "@handle" on images.
  watermark: ""

quality:
  # The reviewer model scores each draft 1-10. Below this it is rewritten once,
  # then dropped.
  min_score: 7
  # 0-1 similarity to any of the last 60 posts. Above this the draft is dropped.
  max_similarity: 0.55
  max_cashtags: 3
  short_post_chars: [280, 1400]
  article_chars: [2500, 9000]

news:
  feeds:
    - https://cointelegraph.com/rss
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://decrypt.co/feed
  max_age_hours: 12

# Your own voice. Edit persona.md: this is what keeps posts from reading like
# generic AI output, and it is the single biggest lever on quality.
persona_file: persona.md

data_dir: data
