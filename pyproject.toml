[project]
name = "w2e"
version = "0.1.0"
description = "Automated, quality-gated publishing pipeline for Binance Square Write to Earn"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
w2e = "w2e.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
