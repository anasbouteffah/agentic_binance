name: w2e

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: w2e

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install .

      - name: Run Write to Earn pipeline
        run: w2e run || (sleep 20 && w2e run)
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save post history
        run: |
          git config user.name "w2e-bot"
          git config user.email "w2e-bot@users.noreply.github.com"
          git add -f data/history.jsonl 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "chore: update post history" && git push)
